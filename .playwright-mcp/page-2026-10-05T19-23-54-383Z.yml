            - generic:
              - heading "Authorization Through External Client Apps or Connected Apps and OAuth 2.0" [level=1] [ref=f7e232]
              - generic [ref=f7e234]:
                - tooltip "Click to copy" [ref=f7e236]:
                  - button "Copy as Markdown" [ref=f7e237] [cursor=pointer]
                  - text: Click to copy
                - button "View as Markdown" [ref=f7e244] [cursor=pointer]
                - tooltip "Click to copy" [ref=f7e251]:
                  - button "Copy URL to Markdown" [ref=f7e252] [cursor=pointer]
                  - text: Click to copy
              - paragraph [ref=f7e257]: For a client application to access REST API resources, it must be authorized as a safe visitor. To implement this authorization, use either an external client app or a connected app and an OAuth 2.0 authorization flow.
              - generic [ref=f7e264]:
                - paragraph [ref=f7e265]: Important
                - generic [ref=f7e266]:
                  - generic:
                    - paragraph [ref=f7e267]:
                      - text: Creating connected apps is restricted as of Spring ‘26. You can continue to use existing connected apps during and after Spring ‘26. However, we recommend using
                      - link "external client apps" [ref=f7e268] [cursor=pointer]:
                        - /url: https://help.salesforce.com/s/articleView?id=xcloud.external_client_apps.htm
                      - text: instead. If you must continue creating connected apps, contact Salesforce Support.
                    - paragraph [ref=f7e269]:
                      - text: See
                      - link "New connected apps can no longer be created in Spring ‘26" [ref=f7e270] [cursor=pointer]:
                        - /url: https://help.salesforce.com/s/articleView?id=005228017&type=1
                      - text: for more details.
              - heading [level=2] [ref=f7e272]:
                - generic [ref=f7e273]:
                  - text: Configure an External Client App or a Connected App
                  - tooltip "Copy link to clipboard" [ref=f7e275]:
                    - button "copy" [ref=f7e277] [cursor=pointer]
                    - text: Copy link to clipboard
              - paragraph [ref=f7e281]: Both external client apps and connected apps request access to REST API resources on behalf of the client application. For an external client app or connected app to request access, it must be integrated with your org’s REST API using the OAuth 2.0 protocol. OAuth 2.0 is an open protocol that authorizes secure data sharing between applications through the exchange of tokens.
              - paragraph [ref=f7e282]:
                - text: For instructions to configure an external client app, see
                - link "Create an External Client App" [ref=f7e283] [cursor=pointer]:
                  - /url: https://help.salesforce.com/s/articleView?id=xcloud.create_a_local_external_client_app.htm
                - text: or
                - link "Enable OAuth Settings for API Integration" [ref=f7e284] [cursor=pointer]:
                  - /url: https://help.salesforce.com/articleView?id=connected_app_create_api_integration.htm
                - text: in
                - emphasis [ref=f7e285]: Salesforce Help
                - text: . For more information about connected apps, see
                - link "Connected Apps" [ref=f7e286] [cursor=pointer]:
                  - /url: https://help.salesforce.com/s/articleView?id=xcloud.connected_app_overview.htm
                - text: in
                - emphasis [ref=f7e287]: Salesforce Help
                - text: .
              - heading [level=2] [ref=f7e289]:
                - generic [ref=f7e290]:
                  - text: Apply an OAuth Authorization Flow
                  - tooltip "Copy link to clipboard" [ref=f7e292]:
                    - button "copy" [ref=f7e294] [cursor=pointer]
                    - text: Copy link to clipboard
              - paragraph [ref=f7e298]: OAuth authorization flows grant a client app restricted access to REST API resources on a resource server. Each OAuth flow offers a different process for approving access to a client application, but in general the flows consist of three main steps.
              - list [ref=f7e299]:
                - listitem [ref=f7e300]: To initiate an authorization flow, a connected app on behalf of a client app requests access to a REST API resource.
                - listitem [ref=f7e301]: In response, an authorizing server grants access tokens to the external client app or connected app.
                - listitem [ref=f7e302]: A resource server validates these access tokens and approves access to the protected REST API resource.
              - paragraph [ref=f7e303]:
                - text: After reviewing and selecting an OAuth authorization flow, apply it to your external client app or connected app. For details about each supported flow, see
                - link "OAuth Authorization Flows" [ref=f7e304] [cursor=pointer]:
                  - /url: https://help.salesforce.com/articleView?id=remoteaccess_oauth_flows.htm
                - text: in
                - emphasis [ref=f7e305]: Salesforce Help
                - text: .
