            - paragraph [ref=e106]:
              - text: To retrieve or store content with Contentful, you first need to authenticate your app with an OAuth bearer token.
              - link [ref=e107] [cursor=pointer]:
                - /url: /developers/docs/references/api-basics
                - text: Contentful offers five APIs
              - text: ", and each requires separate authentication, except for the Images API, which delivers images without authentication."
            - paragraph [ref=e108]: A token provides read-only access to one or more environments. We recommend using different access tokens for different environments in your development process. For example, use one for your production environment and another for staging or continuous integration. This allows you to revoke them individually in the future and manage your delivery channels independently.
            - paragraph [ref=e109]:
