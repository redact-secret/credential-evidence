            - heading "Date and time format" [level=2] [ref=f5e1718] [cursor=pointer]
            - paragraph [ref=f5e1719]:
              - text: Date and time must be formatted according to
              - link "ISO 8601" [ref=f5e1720] [cursor=pointer]:
