            - paragraph [ref=f5e1729]:
              - strong [ref=f5e1730]: Important
              - text: ": When setting time, ensure to indicate timezone. With no timezone specified, UTC+0 is applied as a default one."
            - paragraph [ref=f5e1731]: "The table below displays the supported date and time formatting:"
