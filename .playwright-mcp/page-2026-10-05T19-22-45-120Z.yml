            - heading "Collection resources and pagination" [level=2] [ref=f5e1771] [cursor=pointer]
            - paragraph [ref=f5e1772]: "Contentful returns collections of resources in a wrapper object that contains extra information useful for paginating over large result sets:"
            - generic [ref=f5e1773]:
              - generic [ref=f5e1780]:
                - generic [ref=f5e1781]: "{"
                - generic [ref=f5e1784]: "\"sys\": { \"type\": \"Array\" },"
                - generic [ref=f5e1787]: "\"skip\": 0,"
                - generic [ref=f5e1790]: "\"limit\": 100,"
                - generic [ref=f5e1793]: "\"total\": 1256,"
                - generic [ref=f5e1796]: "\"items\": [ /* 100 individual resources */ ]"
                - generic [ref=f5e1799]: "}"
              - generic:
                - button "Report incorrect code"
                - button "Copy to clipboard"
            - paragraph [ref=f5e1802]:
              - text: In the above example, a client retrieves the next 100 resources by repeating the same request, changing the
              - code [ref=f5e1803]: skip
              - text: query parameter to
              - code [ref=f5e1804]: "100"
              - text: . You can use the
              - code [ref=f5e1805]: order
              - text: parameter when paging through larger result sets to keep ordering predictable. For example,
              - code [ref=f5e1806]: order=sys.createdAt
              - text: will order results by the time the resource was first published.
            - generic [ref=f5e1810]:
              - paragraph [ref=f5e1811]:
                - text: Don’t use
                - code [ref=f5e1812]: skip
                - text: to iterate through an entire collection. Performance degrades as the offset grows, particularly for complex queries and deep link resolution.
                - code [ref=f5e1813]: skip
                - text: /
                - code [ref=f5e1814]: limit
                - text: is intended for random access into a bounded result set (for example, “page 3 of 20” in a UI).
              - paragraph [ref=f5e1815]:
                - text: To fetch or process every item in a large collection, such as exports, analytics, migrations, or any exhaustive traversal, use
                - link "cursor pagination" [ref=f5e1816] [cursor=pointer]:
                  - /url: /developers/docs/references/content-management-api/overview/#cursor-pagination
                - text: instead.
            - heading "Filter results" [level=2] [ref=f5e1817] [cursor=pointer]
            - paragraph [ref=f5e1818]: You can use a variety of filter parameters to search and filter items in the response from collection endpoints.
            - heading "Example usage" [level=3] [ref=f5e1819] [cursor=pointer]
            - generic [ref=f5e1820]:
              - generic [ref=f5e1821]: name[match]=fred&sys.user.sys.id[in]=abc123,zyx987&sys.updatedAt[lt]=2018-09-01
              - generic:
                - button "Report incorrect code"
                - button "Copy to clipboard"
            - paragraph [ref=f5e1831]: "In general the format of a filter parameter is as follows:"
            - generic [ref=f5e1832]:
              - generic [ref=f5e1833]: field[operator]=value
              - generic:
                - button "Report incorrect code"
                - button "Copy to clipboard"
            - heading "Operators" [level=3] [ref=f5e1843] [cursor=pointer]
            - paragraph [ref=f5e1844]: "For each supported field, one or more operators is available. This table explains their usage:"
            - table [ref=f5e1849]:
              - rowgroup [ref=f5e1850]:
                - row [ref=f5e1851]:
                  - columnheader "Operator" [ref=f5e1852]
                  - columnheader "Description" [ref=f5e1853]
              - rowgroup [ref=f5e1854]:
                - row [ref=f5e1855]:
                  - cell [ref=f5e1856]:
                    - code [ref=f5e1857]: eq
                  - cell [ref=f5e1858]:
                    - text: The resource field exactly matches the specified value. E.g.
                    - code [ref=f5e1859]: name[eq]=fred
                    - text: (or
                    - code [ref=f5e1860]: name=fred
                    - text: for short). Maximum length for text fields is 256 characters
                - row [ref=f5e1861]:
                  - cell [ref=f5e1862]:
                    - code [ref=f5e1863]: ne
                  - cell [ref=f5e1864]:
                    - text: The resource field does
                    - emphasis [ref=f5e1865]: not
                    - text: match the specified value. E.g.
                    - code [ref=f5e1866]: name[ne]=fred
                - row [ref=f5e1867]:
                  - cell [ref=f5e1868]:
                    - code [ref=f5e1869]: match
                  - cell [ref=f5e1870]:
                    - text: The resource field starts with the specified value. E.g.
                    - code [ref=f5e1871]: name[match]=fre
                - row [ref=f5e1872]:
                  - cell [ref=f5e1873]:
                    - code [ref=f5e1874]: in
                  - cell [ref=f5e1875]:
                    - text: The resource field matches at least one of the specified values in a comma separated list. E.g.
                    - code [ref=f5e1876]: sys.user.sys.id[in]=abc123,zyx987
                    - text: . Maximum length for text fields is 256 characters
                - row [ref=f5e1877]:
                  - cell [ref=f5e1878]:
                    - code [ref=f5e1879]: nin
                  - cell [ref=f5e1880]:
                    - text: The resource field does
                    - emphasis [ref=f5e1881]: not
                    - text: match any of the specified values in a comma separated list. E.g.
                    - code [ref=f5e1882]: sys.user.sys.id[nin]=abc123,zyx987
                - row [ref=f5e1883]:
                  - cell [ref=f5e1884]:
                    - code [ref=f5e1885]: exists
                  - cell [ref=f5e1886]:
                    - text: The resource field is not empty if the specified value is
                    - code [ref=f5e1887]: "true"
                    - text: ", or empty if the specified value is"
                    - code [ref=f5e1888]: "false"
                    - text: . E.g.
                    - code [ref=f5e1889]: sys.updatedAt[exists]=true
                - row [ref=f5e1890]:
                  - cell [ref=f5e1891]:
                    - code [ref=f5e1892]: lt
                  - cell [ref=f5e1893]:
                    - text: The resource field is less than the specified value. E.g.
                    - code [ref=f5e1894]: sys.updatedAt[lt]=2018-09-01
                - row [ref=f5e1895]:
                  - cell [ref=f5e1896]:
                    - code [ref=f5e1897]: lte
                  - cell [ref=f5e1898]:
                    - text: The resource field is less than or equal to the specified value. E.g.
                    - code [ref=f5e1899]: sys.updatedAt[lte]=2018-09-01
                - row [ref=f5e1900]:
                  - cell [ref=f5e1901]:
                    - code [ref=f5e1902]: gt
                  - cell [ref=f5e1903]:
                    - text: The resource field is greater than the specified value. E.g.
                    - code [ref=f5e1904]: sys.updatedAt[gt]=2018-09-01
                - row [ref=f5e1905]:
                  - cell [ref=f5e1906]:
                    - code [ref=f5e1907]: gte
                  - cell [ref=f5e1908]:
                    - text: The resource field is greater than or equal to the specified value. E.g.
                    - code [ref=f5e1909]: sys.updatedAt[gte]=2018-09-01
                - row [ref=f5e1910]:
                  - cell [ref=f5e1911]:
                    - code [ref=f5e1912]: all
                  - cell "Returns only items whose selected field contains every value you specify in the filter" [ref=f5e1913]
            - heading "Cursor pagination" [level=2] [ref=f5e1914] [cursor=pointer]
            - heading "Overview" [level=4] [ref=f5e1915] [cursor=pointer]
            - paragraph [ref=f5e1916]: Cursor pagination is an approach to paginating datasets in Contentful APIs. Unlike traditional offset-based pagination, which uses skip and limit parameters, cursor-based pagination uses opaque cursor tokens and dedicated next/prev links to mark the position in the dataset. This can dramatically improve performance, especially for datasets with large numbers of items.
            - paragraph [ref=f5e1917]: Use cursor pagination whenever you need to traverse a whole collection, for example, exporting a space, running analytics over all entries, or processing every asset.
            - paragraph [ref=f5e1918]:
              - text: Use offset pagination (
              - code [ref=f5e1919]: skip
              - text: /
              - code [ref=f5e1920]: limit
              - text: ) only for bounded, random-access cases, such as showing a specific page of results in a UI.
            - heading "How cursor pagination works" [level=4] [ref=f5e1921] [cursor=pointer]
            - list [ref=f5e1922]:
              - listitem [ref=f5e1923]:
                - text: ⦁
                - paragraph [ref=f5e1924]:
                  - strong [ref=f5e1925]: "Initial Request:"
                  - text: Add the query parameter
                  - code [ref=f5e1926]: cursor=true
                  - text: to your API request, e.g.
                - generic [ref=f5e1927]:
                  - generic [ref=f5e1928]: GET /spaces/:space_id/entries?cursor=true
                  - generic:
                    - button "Report incorrect code"
                    - button "Copy to clipboard"
                - paragraph [ref=f5e1938]: "The response contains:"
                - list [ref=f5e1939]:
                  - listitem [ref=f5e1940]:
                    - text: ⦁
                    - code [ref=f5e1941]: items
                    - text: ": The current page of resources."
                  - listitem [ref=f5e1942]:
                    - text: ⦁
                    - code [ref=f5e1943]: pages
                    - text: ": Contains"
                    - code [ref=f5e1944]: next
                    - text: (and optionally
                    - code [ref=f5e1945]: prev
                    - text: ) URLs for paginating forward and backward.
              - listitem [ref=f5e1946]:
                - text: ⦁
                - paragraph [ref=f5e1947]:
                  - strong [ref=f5e1948]: "Paginate forward:"
                  - text: Use the
                  - code [ref=f5e1949]: pages.next
                  - text: "URL from the previous response for the next page request:"
                - generic [ref=f5e1950]:
                  - generic [ref=f5e1951]: "GET /spaces/:space_id/entries?pageNext={cursor_token}"
                  - generic:
                    - button "Report incorrect code"
                    - button "Copy to clipboard"
                - paragraph [ref=f5e1961]:
                  - text: Continue this process until the
                  - code [ref=f5e1962]: next
                  - text: link is omitted, which means you’ve reached the end of the dataset.
              - listitem [ref=f5e1963]:
                - text: ⦁
                - paragraph [ref=f5e1964]:
                  - strong [ref=f5e1965]: "Paginate backward:"
                  - text: If the response contains a
                  - code [ref=f5e1966]: pages.prev
                  - text: "link, you can fetch previous pages:"
                - generic [ref=f5e1967]:
                  - generic [ref=f5e1968]: "GET /spaces/:space_id/entries?pagePrev={cursor_token}"
                  - generic:
                    - button "Report incorrect code"
                    - button "Copy to clipboard"
              - listitem [ref=f5e1978]:
                - text: ⦁
                - paragraph [ref=f5e1979]:
                  - strong [ref=f5e1980]: "Consistency:"
                  - text: All query parameters used in the initial request apart from
                  - code [ref=f5e1981]: limit
                  - text: are locked and encoded in the cursor token. They cannot be changed between pages.
                - paragraph [ref=f5e1982]:
                  - text: The
                  - code [ref=f5e1983]: limit
                  - text: parameter can be updated, and the new value will be persisted for subsequent pages until it’s updated again.
                - generic [ref=f5e1984]:
                  - generic [ref=f5e1985]: "GET /spaces/:space_id/entries?pageNext={cursor_token}&limit={limit}"
                  - generic:
                    - button "Report incorrect code"
                    - button "Copy to clipboard"
                - paragraph [ref=f5e1995]: This can be useful when you need to adjust the page size, for example, if a page size (in bytes) exceeds the response limit.
              - listitem [ref=f5e1996]:
                - text: ⦁
                - paragraph [ref=f5e1997]:
                  - strong [ref=f5e1998]: "Total count:"
                  - text: The response does not include a total count or a skip property. This is a key feature for performance, as the API avoids costly full counts on large datasets.
            - heading "Example response" [level=4] [ref=f5e1999] [cursor=pointer]
            - generic [ref=f5e2000]:
              - generic [ref=f5e2007]:
                - generic [ref=f5e2008]: "{"
                - generic [ref=f5e2011]: "\"sys\": { \"type\": \"Array\" },"
                - generic [ref=f5e2014]: "\"limit\": 100,"
                - generic [ref=f5e2017]: "\"items\": [ ... ],"
                - generic [ref=f5e2020]: "\"pages\": {"
                - generic [ref=f5e2023]: "\"next\": \"/spaces/:space_id/entries?pageNext=cursor_token\","
                - generic [ref=f5e2026]: "\"prev\": \"/spaces/:space_id/entries?pagePrev=cursor_token\""
                - generic [ref=f5e2029]: "}"
                - generic [ref=f5e2032]: "}"
              - generic:
                - button "Report incorrect code"
                - button "Copy to clipboard"
            - heading "Advantages" [level=4] [ref=f5e2035] [cursor=pointer]
            - list [ref=f5e2036]:
              - listitem [ref=f5e2037]: ⦁ Considerable performance improvements, particularly for large datasets.
            - paragraph [ref=f5e2038]: If your environment contains 10s of thousands of entries or assets, consider switching to cursor pagination, it can make requests to fetch lists of entries or assets of such an environment much faster.
            - paragraph [ref=f5e2039]:
              - text: If you don’t paginate at all, particularly when working with CDA and you don’t need the
              - code [ref=f5e2040]: total
              - text: property from the response, we highly recommend using requests with
              - code [ref=f5e2041]: cursor=true
              - text: .
            - heading "Limitations" [level=4] [ref=f5e2042] [cursor=pointer]
            - list [ref=f5e2043]:
              - listitem [ref=f5e2044]:
                - text: ⦁
                - strong [ref=f5e2045]: The “total” property is not included in the API responses.
                - text: Make sure you don’t rely on it in your workflow prior to making the switch.
            - heading "Enablement and access" [level=4] [ref=f5e2046] [cursor=pointer]
            - list [ref=f5e2047]:
              - listitem [ref=f5e2048]: ⦁ The feature is currently available in the CMA, CPA and CDA.
            - heading "API versioning" [level=2] [ref=f5e2049] [cursor=pointer]
            - paragraph [ref=f5e2050]:
              - text: All API requests should specify a
              - code [ref=f5e2051]: Content-Type
              - text: header of
              - code [ref=f5e2052]: application/vnd.contentful.management.v1+json
              - text: .
            - paragraph [ref=f5e2053]:
              - text: If not specified, Contentful will route your request to the latest version of the API. This could break clients which expect the outdated API version. To be certain, always specify the
              - code [ref=f5e2054]: Content-Type
              - text: header.
        - generic [ref=f5e2055]:
          - generic [ref=f5e2059]:
            - generic [ref=f5e2060]: Was this page helpful?
            - generic [ref=f5e2061]:
              - button "Yes" [ref=f5e2062] [cursor=pointer]
              - button "No" [ref=f5e2063] [cursor=pointer]
          - navigation "Up next" [ref=f5e2064]:
