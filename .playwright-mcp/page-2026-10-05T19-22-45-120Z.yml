      - generic [ref=f5e1344]:
        - article [ref=f5e1345]:
          - generic [ref=f5e1347]:
            - heading "Overview" [level=1] [ref=f5e1350]
            - generic [ref=f5e1352]:
              - button "Copy page" [ref=f5e1353] [cursor=pointer]
              - button [ref=f5e1361] [cursor=pointer]
          - generic [ref=f5e1367]:
            - paragraph [ref=f5e1368]:
              - text: Contentful’s Content Management API (CMA) helps you manage content in your spaces. To learn more about how to model your content,
              - link "read our modeling guide" [ref=f5e1369] [cursor=pointer]:
                - /url: /developers/docs/concepts/data-model
              - text: .
            - paragraph [ref=f5e1370]:
              - strong [ref=f5e1371]: NOTE
              - text: ": You can use the CMA to deliver and manage content, but you shouldn’t use it to deliver large amounts of content and instead use the"
              - link "Content Delivery API" [ref=f5e1372] [cursor=pointer]:
                - /url: /developers/docs/references/content-delivery-api/overview
              - text: . The structure of responses from the CMA differs from the CDA as
              - code [ref=f5e1373]: GET
              - text: responses retrieve the entirety of items (i.e. all localized and unpublished content).
            - generic [ref=f5e1377]:
              - strong [ref=f5e1378]: "Note:"
              - text: For EU data residency customers, the Base URL is
              - emphasis [ref=f5e1379]:
                - link "https://api.eu.contentful.com" [ref=f5e1380] [cursor=pointer]:
                  - /url: https://api.eu.contentful.com/
              - text: .
            - heading "Basic API information" [level=2] [ref=f5e1385] [cursor=pointer]
            - paragraph [ref=f5e1386]:
              - text: API Base URL
              - code [ref=f5e1387]: https://api.contentful.com
              - emphasis [ref=f5e1388]: This is a read/write API
            - heading "Authentication" [level=2] [ref=f5e1389] [cursor=pointer]
            - paragraph [ref=f5e1390]: You access the API securely via HTTPS, and it will be available to clients authenticating with an access token.
            - paragraph [ref=f5e1391]:
              - text: Learn about authenticating to the CMA and get your access token from the
              - link "developer center" [ref=f5e1392] [cursor=pointer]:
                - /url: /developers/docs/references/authentication#the-content-management-api
              - text: .
            - heading "Resource IDs" [level=2] [ref=f5e1393] [cursor=pointer]
            - paragraph [ref=f5e1394]: "When creating resources, you can specify an ID or let the API generate a random ID for you. If you choose an ID yourself it must adhere to the following rules:"
            - list [ref=f5e1395]:
              - listitem [ref=f5e1396]:
                - text: ⦁
                - paragraph [ref=f5e1397]: It has a length between 1 and 64 characters.
              - listitem [ref=f5e1398]:
                - text: ⦁
                - paragraph [ref=f5e1399]:
                  - text: It only includes alphanumeric characters, dots
                  - code [ref=f5e1400]: .
                  - text: ", hyphens"
                  - code [ref=f5e1401]: "-"
                  - text: or underscores
                  - code [ref=f5e1402]: _
                  - text: .
            - paragraph [ref=f5e1403]:
              - text: Represented as a regular expression, this is
              - code [ref=f5e1404]: "/^[a-zA-Z0-9-_.]{1,64}$/"
              - text: .
            - heading "Updating content" [level=2] [ref=f5e1405] [cursor=pointer]
            - paragraph [ref=f5e1406]: Contentful doesn’t merge changes made to content, so when updating content, you need to send the entire body of an entry. If you update content with a subset of properties, you will lose all existing properties not included in that update.
            - paragraph [ref=f5e1407]: "You should always update resources in the following order:"
            - list [ref=f5e1408]:
              - listitem [ref=f5e1409]:
                - text: ⦁
                - paragraph [ref=f5e1410]: Fetch current resource.
              - listitem [ref=f5e1411]:
                - text: ⦁
                - paragraph [ref=f5e1412]: Make changes to the current resource.
              - listitem [ref=f5e1413]:
                - text: ⦁
                - paragraph [ref=f5e1414]: Update the resource by passing the changed resource along with current version number.
            - paragraph [ref=f5e1415]: This way no unseen changes are overridden and unexpected conflicts are unlikely to occur.
            - paragraph [ref=f5e1416]:
              - strong [ref=f5e1417]: Note
              - text: ": You can’t update any of the"
              - code [ref=f5e1418]: sys
              - text: property fields, including
              - code [ref=f5e1419]: sys.id
              - text: .
            - heading "Updating and version locking" [level=2] [ref=f5e1420] [cursor=pointer]
            - paragraph [ref=f5e1421]:
              - text: Contentful uses
              - link "optimistic locking" [ref=f5e1422] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Optimistic_concurrency_control
              - text: . When updating an existing resource, you need to specify its current version with the
              - code [ref=f5e1427]: X-Contentful-Version
              - text: HTTP header (this header is automatically set when using our
              - link "official client libraries" [ref=f5e1428] [cursor=pointer]:
                - /url: /developers/docs/sdks/javascript/sdks
              - text: ). Contentful compares this version with the current version stored to ensure that a client doesn’t overwrite a resource that has since been updated. If the version changed in-between, Contentful would reject the update.
            - heading "API rate limits" [level=2] [ref=f5e1429] [cursor=pointer]
            - paragraph [ref=f5e1430]: API Rate limits specify the number of requests a client can make to Contentful APIs in a specific time frame. Every request counts against a per second rate limit.
            - paragraph [ref=f5e1431]:
              - text: By default the Contentful Management API enforces rate limits of
              - strong [ref=f5e1432]: "7"
              - text: requests per second. Higher rate limits may apply depending on your current plan.
            - paragraph [ref=f5e1433]:
              - text: The following table lists all headers returned in
              - emphasis [ref=f5e1434]: every
              - text: "response by the Content Management API which give a client information on rate limiting:"
            - table [ref=f5e1439]:
              - rowgroup [ref=f5e1440]:
                - row [ref=f5e1441]:
                  - columnheader "Header" [ref=f5e1442]
                  - columnheader "Description" [ref=f5e1443]
              - rowgroup [ref=f5e1444]:
                - row [ref=f5e1445]:
                  - cell [ref=f5e1446]:
                    - code [ref=f5e1447]: X-Contentful-RateLimit-Second-Limit
                  - cell "The maximum amount of requests which can be made in a second." [ref=f5e1448]
                - row [ref=f5e1449]:
                  - cell [ref=f5e1450]:
                    - code [ref=f5e1451]: X-Contentful-RateLimit-Second-Remaining
                  - cell "The remaining amount of requests which can be made until the next secondly reset." [ref=f5e1452]
                - row [ref=f5e1453]:
                  - cell [ref=f5e1454]:
                    - code [ref=f5e1455]: X-Contentful-RateLimit-Reset
                  - cell "The number of seconds until the next request can be made." [ref=f5e1456]
            - paragraph [ref=f5e1457]: "Here is a part of a Contentful Management API response example showing the headers for rate limiting:"
            - generic [ref=f5e1458]:
              - generic [ref=f5e1465]:
                - generic [ref=f5e1466]: "X-Contentful-RateLimit-Reset: 0"
                - generic [ref=f5e1469]: "X-Contentful-RateLimit-Second-Limit: 7"
                - generic [ref=f5e1472]: "X-Contentful-RateLimit-Second-Remaining: 9"
              - generic:
                - button "Report incorrect code"
                - button "Copy to clipboard"
            - paragraph [ref=f5e1475]:
              - text: When a client gets rate limited, the API responds with the
              - strong [ref=f5e1476]: 429 Too Many Requests
              - text: HTTP status code and sets the value
              - code [ref=f5e1477]: X-Contentful-RateLimit-Reset
              - text: header to an integer specifying the time before the limit resets and another request will be accepted. As the client is rate limited per second, the header will return 1, which means the next second.
            - paragraph [ref=f5e1478]: "Examples:"
            - paragraph [ref=f5e1479]: The current rate limits for a client are the default 7 per second.
            - paragraph [ref=f5e1480]:
              - strong [ref=f5e1481]: Example 1
            - paragraph [ref=f5e1482]: "Client: 5 requests in 1 second"
            - generic [ref=f5e1483]:
              - generic [ref=f5e1490]:
                - generic [ref=f5e1491]: HTTP/1.1 2xx
                - generic [ref=f5e1494]: "X-Contentful-RateLimit-Reset: 0"
              - generic:
                - button "Report incorrect code"
                - button "Copy to clipboard"
            - paragraph [ref=f5e1497]: "Meaning: not rate limited. More requests are allowed."
            - paragraph [ref=f5e1498]:
              - strong [ref=f5e1499]: Example 2
            - paragraph [ref=f5e1500]: "Client: 11 requests in 1 second"
            - generic [ref=f5e1501]:
              - generic [ref=f5e1508]:
                - generic [ref=f5e1509]: HTTP/1.1 429
                - generic [ref=f5e1512]: "X-Contentful-RateLimit-Reset: 1"
              - generic:
                - button "Report incorrect code"
                - button "Copy to clipboard"
            - paragraph [ref=f5e1515]: "Meaning: wait 1 second before making more requests."
            - paragraph [ref=f5e1516]:
              - strong [ref=f5e1517]: Example 3
            - paragraph [ref=f5e1518]: "Client: 9000 requests in 15 minutes, 9000 requests in following 15 minutes, 9000 requests in following 15 minutes, 9000 requests in following 15 minutes"
            - generic [ref=f5e1519]:
              - generic [ref=f5e1526]:
                - generic [ref=f5e1527]: HTTP/1.1 429
                - generic [ref=f5e1530]: "X-Contentful-RateLimit-Reset: 900"
              - generic:
                - button "Report incorrect code"
                - button "Copy to clipboard"
            - paragraph [ref=f5e1533]: "Meaning: wait 15 minutes before making more requests (which frees up 9000 requests - 15 minutes later 9000 requests get freed up and so on)."
            - heading "Common resource attributes" [level=2] [ref=f5e1534] [cursor=pointer]
            - paragraph [ref=f5e1535]:
              - text: Every resource returned by the API includes a
              - code [ref=f5e1536]: sys
              - text: property. The
              - code [ref=f5e1537]: sys
              - text: object contains system managed and resource dependent information. At minimum
              - code [ref=f5e1538]: sys
              - text: defines the
              - code [ref=f5e1539]: sys.type
              - text: property.
            - paragraph [ref=f5e1540]:
              - text: During entity creation, the value of
              - code [ref=f5e1541]: sys.id
              - text: is either automatically generated or can be specified in the URL (e.g.
              - code [ref=f5e1542]: /environments/master/entries/my-custom-id
              - text: ) of the initial
              - code [ref=f5e1543]: PUT
              - text: request. The only entity which always uses generated
              - code [ref=f5e1544]: sys.id
              - text: values is
              - code [ref=f5e1545]: spaces
              - text: .
            - paragraph [ref=f5e1546]:
              - strong [ref=f5e1547]: Note
              - text: ":"
              - code [ref=f5e1548]: sys
              - text: metadata fields can not be changed programmatically.
            - paragraph [ref=f5e1549]:
              - text: The
              - code [ref=f5e1550]: sys.id
              - text: property is defined for every resource that is not a collection. For example, a
              - code [ref=f5e1551]: Space
              - text: resource will have a
              - code [ref=f5e1552]: sys.type
              - text: and
              - code [ref=f5e1553]: sys.id
