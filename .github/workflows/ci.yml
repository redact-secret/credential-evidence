name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only reads this repository. The legacy checkout
# below is a public repository and needs no token scope beyond this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned legacy revision (scripts/migrate/lib/legacy-source.mjs LEGACY_REVISION).
  LEGACY_REVISION: 1020d2b5905e8973098235e57c4cdca3359bba57

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned legacy repository (read-only input for migration checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redact-secret/redact-secret-benchmarks
          ref: ${{ env.LEGACY_REVISION }}
          path: legacy-benchmarks
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate schemas and records
        run: npm run validate

      - name: Identity lint
        run: npm run lint:identity

      - name: Narrative lint
        run: npm run lint:narrative

      - name: Skill lint
        run: npm run lint:skills

      - name: Coverage report is current (docs/research)
        run: npm run coverage:gaps:check

      - name: Test
        run: npm test
        env:
          LEGACY_BENCHMARKS_DIR: ${{ github.workspace }}/legacy-benchmarks
          REQUIRE_LEGACY: "1"

      - name: Migration checks
        run: npm run migrate:check
        env:
          LEGACY_BENCHMARKS_DIR: ${{ github.workspace }}/legacy-benchmarks

      - name: Legacy projection is current (manifest and, if present, output)
        run: npm run export:legacy:check

      - name: Parity against the pinned legacy revision (0 unexplained, report current)
        run: npm run parity:check
        env:
          LEGACY_BENCHMARKS_DIR: ${{ github.workspace }}/legacy-benchmarks

      - name: Fixture materialization check (records verified, digest matches the cases report)
        run: npm run fixtures:materialize:check
